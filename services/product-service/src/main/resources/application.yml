spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway quản lý schema (db/migration); Hibernate chỉ đối chiếu, không tự sinh/sửa bảng.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    # db/seed = danh mục thuốc và đơn mẫu có sẵn. Tách khỏi db/migration vì test chạy Flyway trên
    # product_db_test và nhiều test giả định bảng trống; pom.xml ghi đè lại chỉ còn db/migration khi test.
    # Số phiên bản dùng chung cho cả hai thư mục: migration schema mới phải bắt đầu từ V7 (V6 là kho thuốc).
    locations: classpath:db/migration,classpath:db/seed
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # Dùng chung secret với auth-service — tự verify chữ ký token, không gọi ngược auth-service.
  secret: ${JWT_SECRET}
