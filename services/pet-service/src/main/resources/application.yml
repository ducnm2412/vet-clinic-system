spring:
  application:
    name: pet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway quản lý schema (db/migration); Hibernate chỉ đối chiếu, không tự sinh/sửa bảng.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    # Các file seed thuốc/đơn mẫu (V7-V12, V14) đã xoá cùng việc chuyển danh mục sang product-service;
    # DB cũ vẫn còn dòng lịch sử của chúng nên phải bỏ qua "missing" thay vì để Flyway báo lỗi validate.
    ignore-migration-patterns: "*:missing,*:future"
  servlet:
    multipart:
      # Ảnh đại diện tối đa 5MB (PetPhotoStorageService.MAX_BYTES); request thêm chút dư cho phần header multipart.
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  upload:
    # Thư mục gốc lưu ảnh thú cưng; trong Docker là volume pet-uploads-data.
    dir: ${UPLOAD_DIR:./uploads}

cloudinary:
  # Đủ cả ba thì ảnh thú cưng lưu trên Cloudinary (DB giữ URL); thiếu thì giữ trên đĩa như trước.
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  # Dùng chung secret với auth-service — tự verify chữ ký token, không gọi ngược auth-service mỗi request.
  secret: ${JWT_SECRET}
