spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway quản lý schema (db/migration); Hibernate chỉ đối chiếu, không tự sinh/sửa bảng.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # Bắt buộc set qua env var (không có default) — app sẽ lỗi rõ ràng nếu thiếu thay vì chạy với secret yếu.
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # ms, mặc định 15 phút
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # ms, mặc định 7 ngày

app:
  admin:
    # Để trống -> bỏ qua seed. Chỉ seed nếu email này chưa tồn tại (idempotent).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  refresh-cookie:
    # Cờ Secure của cookie refresh token. Mặc định false để chạy được ở dev (http://localhost:3000
    # không phải HTTPS, trình duyệt sẽ bỏ qua cookie Secure). Bật true ở production (HTTPS).
    secure: ${REFRESH_COOKIE_SECURE:false}

google:
  # OAuth Client ID (loại Web) từ Google Cloud Console — không phải secret, chỉ dùng để kiểm
  # audience của ID token. Để trống thì /auth/google luôn từ chối (audience rỗng không khớp gì).
  client-id: ${GOOGLE_CLIENT_ID:}

facebook:
  # App ID không phải secret (dùng cả ở frontend). App Secret THẬT SỰ là bí mật — chỉ đọc ở
  # đây, không bao giờ đưa vào build frontend. Để trống thì /auth/facebook luôn từ chối.
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}
  api-version: ${FACEBOOK_API_VERSION:v21.0}
