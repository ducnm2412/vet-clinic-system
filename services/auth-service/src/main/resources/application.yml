spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway quản lý schema (db/migration); Hibernate chỉ đối chiếu, không tự sinh/sửa bảng.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # Bắt buộc set qua env var (không có default) — app sẽ lỗi rõ ràng nếu thiếu thay vì chạy với secret yếu.
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # ms, mặc định 15 phút
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # ms, mặc định 7 ngày
