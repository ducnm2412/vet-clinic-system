# Tu dong deploy len may ao (VMware) qua self-hosted runner.
# Push len master -> pull code trong thu muc du an tren may ao -> chi build lai service thay doi.
# Chay tay: tab Actions -> Deploy -> Run workflow (co the nhap ten service, hoac "all").

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      services:
        description: 'Service can build lai, cach nhau dau cach (vd: auth-service frontend), hoac "all"'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: /home/ngominhduc/Desktop/hkdn/vet-clinic-system
    steps:
      - name: Pull code moi
        id: pull
        run: |
          cd "$APP_DIR"
          OLD=$(git rev-parse HEAD)
          git fetch origin master
          git reset --hard origin/master
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Xac dinh service can build
        id: detect
        run: |
          cd "$APP_DIR"
          if [ -n "${{ github.event.inputs.services }}" ]; then
            SV="${{ github.event.inputs.services }}"
          else
            SV=""
            for f in $(git diff --name-only ${{ steps.pull.outputs.old }} HEAD); do
              case "$f" in
                services/*/*)                SV="$SV $(echo "$f" | cut -d/ -f2)" ;;
                eureka-server/*)             SV="$SV eureka-server" ;;
                api-gateway/*)               SV="$SV api-gateway" ;;
                frontend/*)                  SV="$SV frontend" ;;
                shared/*|docker-compose.yml) SV="all"; break ;;
              esac
            done
          fi
          SV=$(echo $SV | tr ' ' '\n' | sort -u | xargs)
          echo "Service can build: ${SV:-(khong co)}"
          echo "services=$SV" >> "$GITHUB_OUTPUT"

      - name: Build va khoi dong lai
        if: steps.detect.outputs.services != ''
        run: |
          cd "$APP_DIR"
          SV="${{ steps.detect.outputs.services }}"
          [ "$SV" = "all" ] && SV=$(docker compose config --services)
          # May ao it RAM: build TUNG service mot (khong song song).
          # Rieng frontend: "next build" can 1-2GB RAM, nen tam dung frontend + cac service Java
          # (giu lai database, rabbitmq, redis) trong luc build, xong bat lai tat ca.
          JAVA_APPS=$(docker compose config --services | grep -E -- '-service$|^eureka-server$|^api-gateway$')
          FAILED=0
          for s in $SV; do
            echo "::group::Build $s"
            if [ "$s" = "frontend" ]; then
              echo "Tam dung frontend va cac service Java de nhuong RAM..."
              docker compose stop frontend $JAVA_APPS
              free -h
            fi
            if ! docker compose build "$s"; then
              echo "::error::Build $s that bai"
              FAILED=1
            fi
            echo "::endgroup::"
            [ $FAILED = 1 ] && break
          done
          # Bat lai toan bo THEO THU TU UU TIEN (service build loi se chay lai image cu).
          bash scripts/start.sh
          exit $FAILED

      - name: Kiem tra trang thai
        if: always()
        run: |
          cd "$APP_DIR"
          docker compose ps
          docker image prune -f
