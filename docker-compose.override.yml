# Gioi han RAM cho may it bo nho (7-8 GB). Compose tu doc file nay.
#
# Healthcheck cua cac service Java: cong HTTP mo = Spring Boot da khoi dong xong.
# (Image eclipse-temurin khong co curl/wget nen dung /dev/tcp cua bash.)
# scripts/start.sh dua vao healthcheck nay de bat tung dot service theo thu tu uu tien.
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
x-hc: &hc
  interval: 10s
  timeout: 3s
  retries: 30
  start_period: 60s
services:
  eureka-server:
    environment:
      <<: *jvm
  api-gateway:
    environment:
      <<: *jvm
    healthcheck:
      <<: *hc
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/8080"]
  auth-service:
    environment:
      <<: *jvm
    healthcheck:
      <<: *hc
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/8081"]
  profile-service:
    environment:
      <<: *jvm
    healthcheck:
      <<: *hc
      test: ["CMD", "bash", "-c", ":> /dev/tcp/localhost/8083"]
  pet-service:
