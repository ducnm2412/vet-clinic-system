server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        # Tắt auto-route theo tên service (/auth-service/**) — dùng route khai báo tay bên dưới
        # để client gọi thẳng /auth/**, /admin/** như thể gọi trực tiếp auth-service.
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/admin/**
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profile/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/booking/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**,/categories/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/cart/**,/orders/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
