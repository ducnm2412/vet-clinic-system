# Khung docker-compose.yml — mỗi service build từ Dockerfile riêng, kết nối qua network chung.
# Đây là bộ khung cấu trúc; cần bổ sung image build, biến môi trường, volume thật khi code từng service.

version: "3.8"

services:
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  auth-service:
    build: ./services/auth-service
    depends_on:
      - eureka-server
      - auth-db

  booking-service:
    build: ./services/booking-service
    depends_on:
      - eureka-server
      - booking-db

  pet-service:
    build: ./services/pet-service
    depends_on:
      - eureka-server
      - pet-db

  product-service:
    build: ./services/product-service
    depends_on:
      - eureka-server
      - product-db

  order-service:
    build: ./services/order-service
    depends_on:
      - eureka-server
      - order-db

  staff-service:
    build: ./services/staff-service
    depends_on:
      - eureka-server
      - staff-db

  notification-service:
    build: ./services/notification-service
    depends_on:
      - eureka-server
      - rabbitmq

  reporting-service:
    build: ./services/reporting-service
    depends_on:
      - eureka-server
      - rabbitmq

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  # --- Databases (Database per Service) ---
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
  booking-db:
    image: postgres:16
    environment:
      POSTGRES_DB: booking_db
  pet-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pet_db
  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: product_db
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
  staff-db:
    image: postgres:16
    environment:
      POSTGRES_DB: staff_db

  # --- Message broker & cache ---
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
