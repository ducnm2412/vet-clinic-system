# Chay toan bo he thong bang mot lenh:
#
#   docker compose up -d --build
#
# Cac service chua code (booking, pet, product, order, staff, notification, reporting)
# nam trong profile "future" nen KHONG chay mac dinh — chung chua co Dockerfile, neu
# de chung o profile mac dinh thi ca lenh `up` se fail o buoc build.
# Khi mot service duoc code xong: viet Dockerfile cho no roi xoa dong `profiles` tuong ung.
#
# Muon xem ca cac service chua code:  docker compose --profile future config

services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || wget -qO- http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USERNAME: ${AUTH_DB_USER:-postgres}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      # Cho Postgres that su nhan ket noi, khong chi cho container start —
      # Flyway chay ngay luc khoi dong nen DB chua san sang la app chet.
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  profile-service:
    build: ./services/profile-service
    container_name: profile-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      DB_USERNAME: ${PROFILE_DB_USER:-postgres}
      DB_PASSWORD: ${PROFILE_DB_PASSWORD:?PROFILE_DB_PASSWORD is required}
      EUREKA_URI: http://eureka-server:8761/eureka/
      # Chung JWT_SECRET voi auth-service de tu verify token, khong goi nguoc auth-service.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      - eureka-server
      - profile-db
      - rabbitmq

  booking-service:
    build: ./services/booking-service
    container_name: booking-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: booking_db
      DB_USERNAME: ${BOOKING_DB_USER:-postgres}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD is required}
      EUREKA_URI: http://eureka-server:8761/eureka/
      # Chung JWT_SECRET với auth-service/profile-service để tự verify token.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      - eureka-server
      - booking-db
      - rabbitmq

  pet-service:
    build: ./services/pet-service
    container_name: pet-service
    depends_on:
      - eureka-server
      - pet-db

  product-service:
    build: ./services/product-service
    container_name: product-service
    depends_on:
      - eureka-server
      - product-db

  order-service:
    build: ./services/order-service
    container_name: order-service
    depends_on:
      - eureka-server
      - order-db

  staff-service:
    build: ./services/staff-service
    container_name: staff-service
    depends_on:
      - eureka-server
      - staff-db

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    depends_on:
      - eureka-server
      - rabbitmq

  reporting-service:
    build: ./services/reporting-service
    container_name: reporting-service
    depends_on:
      - eureka-server
      - rabbitmq

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      # Trong mang Docker goi nhau bang ten service, khong phai localhost.
      # Moi request /api-proxy/* deu di qua gateway (ke ca /profile/**).
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      - api-gateway

  # --- Databases (Database per Service) ---
  auth-db:
    image: postgres:16
    container_name: auth-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-db:
    image: postgres:16
    container_name: profile-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: ${PROFILE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?PROFILE_DB_PASSWORD is required}
  booking-db:
    image: postgres:16
    container_name: booking-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: ${BOOKING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD is required}
  pet-db:
    image: postgres:16
    container_name: pet-db
    environment:
      POSTGRES_DB: pet_db
  product-db:
    image: postgres:16
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
  staff-db:
    image: postgres:16
    container_name: staff-db
    environment:
      POSTGRES_DB: staff_db

  # --- Message broker & cache ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Dat user rieng thay vi dung "guest" mac dinh — guest chi duoc phep ket noi tu
      # localhost, ma cac service khac ket noi qua network Docker thi khong tinh la localhost.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # ==========================================================================
  # Duoi day la cac service chua duoc code (chi co README, chua co Dockerfile).
  # Profile "future" giu chung ngoai lenh `docker compose up` mac dinh.
  # Da roi khoi danh sach nay: product-service, order-service (xem cau hinh day du o tren).
  # ==========================================================================

  booking-service:
    profiles: ["future"]
    build: ./services/booking-service
    container_name: booking-service
    depends_on:
      - eureka-server
      - booking-db

  pet-service:
    profiles: ["future"]
    build: ./services/pet-service
    container_name: pet-service
    depends_on:
      - eureka-server
      - pet-db

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USERNAME: ${PRODUCT_DB_USER:-postgres}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      EUREKA_URI: http://eureka-server:8761/eureka/
      # Chung JWT_SECRET voi auth-service de tu verify token.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: ${ORDER_DB_USER:-postgres}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      EUREKA_URI: http://eureka-server:8761/eureka/
      # Chung JWT_SECRET voi auth-service de tu verify token.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ORDER_SHIPPING_FEE: ${ORDER_SHIPPING_FEE:-30000}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      # Checkout goi product-service lay gia va kiem ton kho.
      product-service:
        condition: service_started

  staff-service:
    profiles: ["future"]
    build: ./services/staff-service
    container_name: staff-service
    depends_on:
      - eureka-server
      - staff-db

  notification-service:
    profiles: ["future"]
    build: ./services/notification-service
    container_name: notification-service
    depends_on:
      - eureka-server
      - rabbitmq

  reporting-service:
    profiles: ["future"]
    build: ./services/reporting-service
    container_name: reporting-service
    depends_on:
      - eureka-server
      - rabbitmq

  booking-db:
    profiles: ["future"]
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
  pet-db:
    profiles: ["future"]
    image: postgres:16
    container_name: pet-db
    environment:
      POSTGRES_DB: pet_db
  product-db:
    image: postgres:16
    container_name: product-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${PRODUCT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER:-postgres} -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  order-db:
    image: postgres:16
    container_name: order-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${ORDER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-postgres} -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  staff-db:
    profiles: ["future"]
    image: postgres:16
    container_name: staff-db
    environment:
      POSTGRES_DB: staff_db

volumes:
  auth-db-data:
  profile-db-data:
  product-db-data:
  order-db-data:
